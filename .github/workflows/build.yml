name: Build DXCFLIX STUDIO APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract supplied project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/DXCFLIX_STUDIO_GitHub_Project_v1.1_SHIZUKU_FIX.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: Expected project ZIP was not found at repository root: $ZIP_FILE"
            echo "Repository root contents:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dxcflix-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/dxcflix-project"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/dxcflix-project" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: ZIP does not contain settings.gradle or settings.gradle.kts"
            find "$RUNNER_TEMP/dxcflix-project" -maxdepth 5 -type f -print | sort
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: Gradle settings found at $PROJECT_DIR, but app module build file is missing."
            find "$PROJECT_DIR" -maxdepth 3 -type f -print | sort
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          test -n "$(find "$GITHUB_WORKSPACE/apk-output" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXCFLIX-STUDIO-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
