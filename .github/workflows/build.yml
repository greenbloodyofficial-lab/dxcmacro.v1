
name: Build DXCFLIX STUDIO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project ZIP
        run: |
          unzip -o DXCFLIX_STUDIO_GitHub_Project_v1.1_SHIZUKU_FIX.zip -d extracted

      - name: Build Debug APK
        run: |
          gradle -p extracted/DXCFLIX_STUDIO :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DXCFLIX-STUDIO-APK
          path: extracted/DXCFLIX_STUDIO/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
